<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Square a Number</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f9f9f9;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    .container {
      background-color: white;
      padding: 30px 40px;
      border-radius: 15px;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.1);
      text-align: center;
    }

    input {
      padding: 10px;
      font-size: 16px;
      width: 200px;
      margin-right: 10px;
      border: 1px solid #ccc;
      border-radius: 8px;
    }

    button {
      padding: 10px 20px;
      font-size: 16px;
      background-color: #4CAF50;
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: background-color 0.3s;
    }

    button:hover {
      background-color: #45a049;
    }

    #result {
      margin-top: 20px;
      font-size: 18px;
      color: #333;
    }
  </style>
</head>
<body>

  <div class="container">
    <h2>Square a Number</h2>
    <input type="number" id="numInput" placeholder="Enter a number" />
    <button onclick="showSquare()">Square It</button>
    <p id="result"></p>
  </div>

  <script>
    function square(num) {
      return num * num;
    }

    function showSquare() {
      const input = document.getElementById("numInput").value;
      if (input === "") {
        document.getElementById("result").textContent = "Please enter a number.";
        return;
      }

      const result = square(Number(input));
      document.getElementById("result").textContent = `Square: ${result}`;
    }
  </script>

</body>
</html>
