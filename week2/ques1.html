<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Age Check</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin-top: 50px;
        }
        .result {
            font-size: 20px;
            font-weight: bold;
            color: green;
        }
    </style>
</head>
<body>
    <h1>Check if Adult</h1>
    <p class="result" id="output"></p>
    
    <script>
        let age = 2;
        let isAdult = age >= 18;
        
        document.getElementById("output").innerText = "Is Adult: " + isAdult;
    </script>
</body>
</html>
